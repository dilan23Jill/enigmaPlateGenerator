<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="icon" type="image/x-icon" href="/img/favicon.ico" />
  <link rel="stylesheet" href="style/style.css" />
  <link href="https://netdna.bootstrapcdn.com/bootstrap/2.3.2/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-datepicker/1.2.0/css/datepicker.min.css"
    rel="stylesheet" />
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>

  <title>Enigma generator</title>
</head>

<body>
  <div id="ctrForm">
    <div class="title_tab">
      <img src="/img/logo_enigma.png" id="imgEnigma" alt="enigma_logo">
      <h1 id="title">PLATE GENERATOR</h1>
    </div>
    <div class="input_tab">

      <div class="wCompanyName window">
        <label for="companyName">Company Name: <sup>*</sup></label>
        <input type="text" id="companyName" class="companyInfo" value="ENIGMA GAMING" />
      </div>

      <div class="wCompanyAddress window">
        <label for="companyAddress">Company Address:<sup>*</sup></label>
        <input type="text" id="companyAddress" class="companyInfo"
          value="ENIGMA GAMING, Vrtine 4, 6276 Pobegi, Slovenia, Europe" />
      </div>

      <div class="wSerialNumber window">
        <label for="serialNumber">S.N. Identifier <sup>*</sup></label>
        <input type="text" id="serialNumber" class="companyInfo" maxlength="11" />
      </div>
      <div class="window">
        <label for="serialNumberStart" class="countNum">First num: <sup>*</sup></label>
        <input type="number" id="serialNumberStart" value="1" class="companyInfo SNcount" maxlength="11" />
      </div>
      <div class="window">
        <label for="serialNumberUntil" class="countNum">Last num: <sup>*</sup> </label>
        <input type="number" id="serialNumberUntil" class="companyInfo SNcount" maxlength="11" value="67" />
        <input type="checkbox" id="chk_maxNumPlate" checked></label>
      </div>
      <div class="window">
        <label for="productionDate">Production Date: <sup>*</sup></label>
        <input type="text" id="productionDate" class="companyInfo" placeholder="MM/YYYY" />
      </div>
      <div class="window">
        <label for="productName">Product: <sup>*</sup></label>
        <input type="text" id="productName" class="companyInfo" />
      </div>
      <div class="window">
        <label for="modelName" id="lbl_modelName">Model Name:</label>
        <input type="text" id="modelName" class="companyInfo" />
        <input type="checkbox" id="chk_enableModelName" />
      </div>
      <div class="window">
        <label for="modelId">Model ID: <sup>*</sup></label>
        <input type="text" id="modelId" class="companyInfo" />
      </div>
      <div class="window">
        <div class="drop_text_elec">
          <select class="ElecRatingsGroup" id="selec_elec_one">
            <option></option>
            <option value="12V">12V</option>
            <option value="24V">24V</option>
            <option value="120V">120V</option>
            <option value="230V">230V</option>
            <option value="120V-230V">120-230V</option>
          </select>
          <input placeholder="Voltage" class="displayValue" id="displayValueOne"
            onfocus="this.select()" type="text">
          <input name="idValueOne" id="idValueOne" type="hidden">
        </div>
        <div class="drop_text_elec">
          <select class="ElecRatingsGroup" id="selec_elec_two">
            <option></option>
            <option value="50Hz">50Hz</option>
            <option value="60Hz">60Hz</option>
            <option value="50/60Hz">50/60Hz</option>
          </select>
          <input name="displayValueTwo" placeholder="Frequency" class="displayValue" id="displayValueTwo"
            onfocus="this.select()" type="text">
          <input name="idValueTwo" id="idValueTwo" type="hidden">
        </div><br />
        <input type="number" id="displayValueThree" name="displayValueThree" placeholder="Wattage" step="10" required>
        <input type="number" id="displayValueFour" name="displayValueFour" placeholder="El. current" step="10" required>
      </div>
      <div class="window">
        <label for="logo_enigma_input">Logo Enigma:</label>
        <input type="file" id="logo_enigma_input" accept="image/svg">

        <label for="logo_certifikat">Logo Certifikat:</label>
        <input type="checkbox" id="logo_certifikat" checked />
        <input type="file" id="logo_certifikat_input" accept="image/svg">
        <br /> <br />
        <br />

        <button type="button" id="previewBtn">PREVIEW</button>
        <button type="button" id="download">DOWNLOAD</button>

      </div><div class="window">

      <label for="plate_width">Plate width</label>
      <input type="range" id="plate_width" min="80" max="100" value="90" step="1" onchange="changeWidth(this.value)"
        oninput="this.nextElementSibling.value = this.value">
      <output>90</output>
      <label for="plate_height">Plate height</label>
      <input type="range" id="plate_height" min="50" max="70" value="54" step="1" onchange="changeHeight(this.value)"
        oninput="this.nextElementSibling.value = this.value">
      <output>54</output>
      <p>Max num on plate: <span id="displayMaxPlate">66</span></p>  
      <p style="display:inline-block">Hole size-r:</p>
      <input type="number" id="hole_size" value="1.75" min="1" max="4" step="0.05">
      <p style="display:inline-block">Text spacing: </p>
      <input type="number" id="text_spacing" value="5.6" min="1" max="10" step="0.1">
     </div>
    </div>
  </div>

  

  
<svg width="600mm" height="600mm" id="bra">
      <svg id="prv_plate" class="plates_final" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="90mm" height="54mm" >
     
        <rect id="svg_plateBorder" x="0" y="0" fill="none" stroke="magenta" stroke-width="0.2mm" />
        <rect id="svg_plateInnerLine" x="1.5mm" y="1.5mm" fill="none" stroke="black" stroke-width="0.5mm" />
        <rect id="svg_underline" x="10mm" y="10mm" width="70mm" height="0.3mm" fill="black" />
        <circle id="svg_hole_tl" class="hole" cx="5mm" cy="5mm" r="1.75mm" stroke="magenta" stroke-width="0.2" fill="none" />
        <circle id="svg_hole_tr" class="hole" cx="85mm" cy="5mm" r="1.75mm" stroke="magenta" stroke-width="0.2" fill="none" />
        <circle id="svg_hole_bl" class="hole" cx="5mm" cy="49mm" r="1.75mm" stroke="magenta" stroke-width="0.2" fill="none" />
        <circle id="svg_hole_br" class="hole" cx="85mm" cy="49mm" r="1.75mm" stroke="magenta" stroke-width="0.2" fill="none" />
        <image id="svg_imgLogo" />
        <image id="svg_imgCertificat" />
        <text id="svg_CompanyName" font-weight="bold" text-anchor="middle" >ENIGMA GAMING</text>
        <text id="svg_serialNumber" class="data serial">Serial Number:</text>
        <text id="svg_productionDate" class="data">Production Date:</text>
        <text id="svg_product" class="data">Product:</text>
        <text id="svg_modelName" class="data">Model Name:</text>
        <text id="svg_modelID" class="data">Model ID:</text>
        <text id="svg_elecRatings" class="data">Elec. ratings:</text>
        <text id="svg_companyAddress" text-anchor="middle" font-size="2.4mm">ENIGMA GAMING, Vrtine 4, 6276 Pobegi,
          Slovenia, Europe</text>
        </svg>
  </svg>


  <script src="script/script.js"></script>
</body>

</html>
