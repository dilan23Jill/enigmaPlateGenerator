<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="icon" type="image/x-icon" href="/img/favicon.ico" />
  <link rel="stylesheet" href="style/style.css" />
  <link href="https://netdna.bootstrapcdn.com/bootstrap/2.3.2/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-datepicker/1.2.0/css/datepicker.min.css"
    rel="stylesheet" />

  <script src="https://ajax.googleapis.com/ajax/libs/jquery/1.10.2/jquery.min.js"></script>
  <script src="https://netdna.bootstrapcdn.com/bootstrap/2.3.2/js/bootstrap.min.js"></script>
  <script
    src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-datepicker/1.2.0/js/bootstrap-datepicker.min.js"></script>


  <title>Enigma serial plate generator</title>
</head>

<body>
  <section id="input_window" class="window">
    <div class="break"></div>
    <form id="parameters">
      <div class="plate_info">
        <label for="companyName"><sup>*</sup>Company Name:</label>
        <input type="text" id="companyName" class="companyInfo" value="ENIGMA GAMING" required /><br />

        <label for="serialNumber"><sup>*</sup>Serial Number:</label>
        <input type="text" id="serialNumber" class="companyInfo" maxlength="11" required />

        <label for="productionDate"><sup>*</sup>Production Date:</label>
        <input type="text" id="productionDate" class="companyInfo" placeholder="MM/YYYY" />

        <label for="productName"><sup>*</sup>Product:</label>
        <input type="text" id="productName" class="companyInfo" required />

        <label for="modelName">Model Name:</label>
        <input type="text" id="modelName" class="companyInfo" />

        <label for="modelId"><sup>*</sup>Model ID:</label>
        <input type="text" id="modelId" class="companyInfo" required />

        <label for="ElecRatings"><sup>*</sup>Elec. ratings:</label>
        <div class="drop_text_elec">
          <select class="ElecRatingsGroup" id="selec_elec_one">
            <option></option>
            <option value="12V">12V</option>
            <option value="24V">24V</option>
            <option value="120V">120V</option>
            <option value="230V">230V</option>
            <option value="120V-230V">120-230V</option>
          </select>
          <input name="displayValueOne" placeholder="Voltage" class="displayValue" id="displayValueOne"
            onfocus="this.select()" type="text">
          <input name="idValueOne" id="idValueOne" type="hidden">
        </div>

        <div class="drop_text_elec">
          <select class="ElecRatingsGroup" id="selec_elec_two">
            <option></option>
            <option value="50Hz">50Hz</option>
            <option value="60Hz">60Hz</option>
            <option value="50/60Hz">50/60Hz</option>
          </select>
          <input name="displayValueTwo" placeholder="Frequency" class="displayValue" id="displayValueTwo"
            onfocus="this.select()" type="text">
          <input name="idValueTwo" id="idValueTwo" type="hidden">
        </div><br />
        <input type="number" id="displayValueThree" name="displayValueThree" placeholder="Wattage" step="10" required>
        <input type="number" id="displayValueFour" name="displayValueFour" placeholder="El. current" step="10" required>



      </div>

      <div class="plate_info">
        <label for="companyAddress"><sup>*</sup>Company Address:</label>
        <input type="text" id="companyAddress" class="companyInfo"
          value="ENIGMA GAMING, Vrtine 4, 6276 Pobegi, Slovenia, Europe" required />

        <label for="logo_enigma_input">Logo Enigma:</label>
        <input type="file" id="logo_enigma_input" accept="image/svg">

        <label for="logo_certifikat">Logo Certifikat:</label>
        <input type="checkbox" id="logo_certifikat" checked />
        <input type="file" id="logo_certifikat_input" accept="image/svg">
      <br />      <br />
      <br />

        <button type="button" id="previewBtn">PREVIEW</button>
        <button type="button" id="downloadBtn">DOWNLOAD</button>


      </div>

      <!--             <input type="submit" value="Submit"> 
 -->
    </form>
  </section>
  <section id="preview_window" class="window">
    <!--     <img src="img/logo_enigma.png" alt="enigma_logo" id="img_enigma_logo" />
 -->
    <!--     <h2>PREVIEW</h2>
 -->
    <div class="parameters_tab">
      <label for="plate_width">Plate width</label>
      <input type="range" id="plate_width" min="80" max="100" value="90" step="1" onchange="changeWidth(this.value)"
        oninput="this.nextElementSibling.value = this.value">
      <output>90</output><br />
      <label for="plate_height">Plate height</label>
      <input type="range" id="plate_height" min="50" max="70" value="54" step="1" onchange="changeHeight(this.value)"
        oninput="this.nextElementSibling.value = this.value">
      <output>54</output><br />

      <!-- <label for="plate_underline">Underline</label>
      <input type="range" id="plate_underline" min="7" max="12" value="10" step="1"
        onchange="changeUnderline(this.value)" oninput="this.nextElementSibling.value = this.value">
      <output>10</output><br /> -->

    </div>
    <a id="a">

      <svg id="prv_plate" width ="90mm" height ="54mm" xmlns="http://www.w3.org/2000/svg"
      xmlns:xlink="http://www.w3.org/1999/xlink">
        <rect id="svg_plateBorder" x="0" y="0" fill="none" stroke="magenta" stroke-width="0.2mm" />
        <rect id="svg_plateInnerLine" x="1.5mm" y="1.5mm" fill="none" stroke="black" stroke-width="0.5mm" />
        <rect id="svg_underline" x="10mm" y="10mm" width="70mm" height="0.3mm" fill="black" />
        <circle id="svg_hole_tl" cx="5mm" cy="5mm" r="1.75mm" stroke="magenta" stroke-width="0.2" fill="none" />
        <circle id="svg_hole_tr" cx="85mm" cy="5mm" r="1.75mm" stroke="magenta" stroke-width="0.2" fill="none" />
        <circle id="svg_hole_bl" cx="5mm" cy="49mm" r="1.75mm" stroke="magenta" stroke-width="0.2" fill="none" />
        <circle id="svg_hole_br" cx="85mm" cy="49mm" r="1.75mm" stroke="magenta" stroke-width="0.2" fill="none" />
        <image id="svg_imgLogo"  />
        <image id="svg_imgCertificat"  width="20" height="20"  y="20" x="20"/>
        <text id="svg_CompanyName" font-weight="bold" text-anchor="middle">ENIGMA GAMING</text>
        <text id="svg_serialNumber" class="data">Serial Number:</text>
        <text id="svg_productionDate" class="data">Production Date:</text>
        <text id="svg_product" class="data">Product:</text>
        <text id="svg_modelName" class="data">Model Name:</text>
        <text id="svg_modelID" class="data">Model ID:</text>
        <text id="svg_elecRatings" class="data">Elec. ratings:</text>
        <text id="svg_companyAddress" text-anchor="middle" font-size="2.4mm">ENIGMA GAMING, Vrtine 4, 6276 Pobegi, Slovenia, Europe</text>
      </svg>
    </a>
  </section>
  <script>

  </script>

  <script src="script/script.js"></script>
</body>

</html>
