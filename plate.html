<!DOCTYPE html>
    <html xmlns="http://www.w3.org/1999/xhtml">
        <head>
        <title>Title</title>
        <meta http-equiv="content-type" content="text/html; charset=UTF-8">
        </head>
        <body style='font-family:arial'>

            <div id="svgDiv" style='background-color:lightgreen;width:400px;height:400px;'>
  <svg id="prv_plate" width="90mm" height="54mm" xmlns="http://www.w3.org/2000/svg">
    <rect id="svg_plateBorder" x="0" y="0" width="90mm" height="90mm" fill="none" stroke="magenta"
      stroke-width="0.1mm" />
    <rect id="svg_plateInnerLine" x="1.5mm" y="1.5mm" width="87mm" height="51mm" fill="none" stroke="black"
      stroke-width="0.5mm" />
    <rect id="svg_underline" x="10mm" y="10mm" width="70mm" height="0.3mm" fill="black" />
    <circle id="svg_hole_tl" cx="5mm" cy="5mm" r="1.75mm" stroke="magenta" stroke-width="0.1" fill="none" />
    <circle id="svg_hole_tr" cx="85mm" cy="5mm" r="1.75mm" stroke="magenta" stroke-width="0.1" fill="none" />
    <circle id="svg_hole_bl" cx="5mm" cy="49mm" r="1.75mm" stroke="magenta" stroke-width="0.1" fill="none" />
    <circle id="svg_hole_br" cx="85mm" cy="49mm" r="1.75mm" stroke="magenta" stroke-width="0.1" fill="none" />
    <text id="svg_CompanyName" x="45mm" y="6.5mm" font-size="4mm" letter-spacing="6" word-spacing="7"
      dominant-baseline="middle" font-weight="bold" text-anchor="middle">ENIGMA GAMING</text>
    <text id="svg_serialNumber" x="36mm" y="17mm" dominant-baseline="middle">Serial Number:</text>
    <text id="svg_productionDate" x="36mm" y="23mm" dominant-baseline="middle">Production Date:</text>
    <text id="svg_product" x="36mm" y="29mm" dominant-baseline="middle">Product:</text>
    <text id="svg_modelName" x="36mm" y="35mm" dominant-baseline="middle">Model Name:</text>
    <text id="svg_modelID" x="36mm" y="41mm" dominant-baseline="middle">Model ID:</text>
    <text id="svg_elecRatings" x="36mm" y="47mm" dominant-baseline="middle">Elec. ratings:</text>
  </svg>
            </div>
          
<script id=myScript>
var Root=prv_plate
function clone(){
 var newPawn=svg_plateBorder.cloneNode(true)
 newPawn.id="newPawn1"
 var move="translate("+0+","+30+")"
 newPawn.setAttribute("transform",move)
 Root.appendChild(newPawn)
}
</script>
            <script>
            document.addEventListener("onload",init(),false)
            function init()
            {
                clone()
                svgSourceValue.value=svgDiv.innerHTML
                jsValue.value=myScript.text
            }
            </script>
        </body>
    </html>
